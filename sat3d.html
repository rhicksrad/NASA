<!doctype html>
<html lang="en">
  <head>
    <!-- @include site-head -->
    <title>Satellite 3D — NASA Open APIs Visualization Hub</title>
    <link rel="stylesheet" href="/src/styles/page-shell.css" />
    <link rel="stylesheet" href="/src/styles/sat3d.css" />
  </head>
  <body class="page--explorer theme-sat3d">
    <!-- @include site-header current="sat3d" -->
    <main class="page-shell sat3d">
      <header class="app-head">
        <h1>Satellite 3D</h1>
        <p>The space station and any satellite you search for, flown live around a day-and-night Earth from their published orbits.</p>
      </header>

      <div class="sat3d-layout">
        <section class="sat3d-stage" aria-label="3D satellite visualization">
          <div id="canvas-holder" class="sat3d-canvas"></div>
          <div id="hover-tooltip" class="sat3d-tooltip" role="presentation" aria-hidden="true"></div>
        </section>

        <aside class="sat3d-sidebar">
          <section class="sat3d-info" id="info" aria-live="off">
            <h2>No satellite selected</h2>
            <p>Click a satellite to follow it.</p>
          </section>

          <section class="sat3d-panel" id="ui">
            <div id="controls" class="sat3d-controls">
              <button id="play-btn" type="button" class="btn btn--primary">Pause</button>
              <button id="now-btn" type="button" class="btn">Now</button>
              <label class="field sat3d-speed">Speed
                <select id="speed-select" class="sat3d-select">
                  <option value="0.25">Quarter speed</option>
                  <option value="1" selected>Real time</option>
                  <option value="4">4 × faster</option>
                  <option value="16">16 × faster</option>
                  <option value="64">64 × faster</option>
                </select>
              </label>
            </div>
            <div class="sat3d-clock">
              <span id="time-readout" class="sat3d-time">–</span>
              <span class="sat3d-clock__zone">in the scene</span>
            </div>

            <div class="sat3d-find">
              <h2>Find a satellite</h2>
              <div id="search-row" class="sat3d-search">
                <label class="field">Name or catalogue number
                  <input id="search-input" type="search" placeholder="Hubble, 25544, Starlink" autocomplete="off" />
                </label>
                <button id="search-btn" type="button" class="btn btn--primary">Search</button>
              </div>
              <button id="sample-btn" type="button" class="btn btn--ghost">Load a sample of well-known satellites</button>
              <div id="search-results" class="sat3d-results" aria-live="polite"></div>
            </div>

            <div id="toggles" class="sat3d-toggles">
              <label class="checkbox"><input id="trail-toggle" type="checkbox" /> Draw a trail behind the selected satellite</label>
              <span class="hover-hint" id="hover-hint">Hover a satellite to see its name.</span>
            </div>
            <div id="selection-controls" class="sat3d-selection">
              <button id="focus-selected-btn" type="button" class="btn">Centre on it</button>
              <button id="clear-selected-btn" type="button" class="btn btn--ghost">Clear selection</button>
            </div>
            <div id="render-status" class="sat3d-status" aria-live="polite"></div>
          </section>
        </aside>
      </div>
    </main>
    <!-- @include site-footer -->
    <script type="module" src="/src/pages/sat3d/main.ts"></script>
  </body>
</html>
