<!doctype html>
<html lang="en">
  <head>
    <!-- @include site-head -->
    <title>CME Explorer — NASA Open APIs Visualization Hub</title>
    <link rel="stylesheet" href="/src/styles/storm.css" />
  </head>
  <body class="page--explorer theme-cme">
    <!-- @include site-header current="storm" -->

    <section class="page-banner">
      <div class="page-banner__text">
        <h1>Solar storms</h1>
        <p>Coronal mass ejections from NASA’s DONKI catalogue: how fast each one left the Sun, when it arrives, and how far from the poles the aurora could reach.</p>
      </div>
      <img src="/art/storm.webp" alt="" width="1536" height="1024" decoding="async" />
    </section>

    <main class="page-shell">
      <div class="main-wrap">
      <section class="controls card">
        <form id="idForm" class="row">
          <label for="id">Activity ID</label>
          <input id="id" name="id" placeholder="YYYY-MM-DDTHH:MM:SS-CME-001" size="40" autocomplete="off" />
          <button id="loadBtn" type="submit" class="btn btn--primary">Load</button>
        </form>

        <section class="examples">
          <h2>Featured CME reports</h2>
          <p class="meta">Jump straight to one of NASA's notable DONKI events.</p>
          <ul class="examples-list">
            <li>
              <button type="button" class="btn btn--ghost" data-activity-id="2024-05-10T07:12:00-CME-001">
                <span class="title">2024 May 10 · AR 13664 X3.9 flare halo</span>
                <span class="description">Bright asymmetrical halo with strong EUV wave and post-eruptive arcades.</span>
              </button>
            </li>
            <li>
              <button type="button" class="btn btn--ghost" data-activity-id="2024-05-10T21:28:00-CME-001">
                <span class="title">2024 May 10 · Long southern filament eruption</span>
                <span class="description">Narrow, faint CME tied to the sprawling S35 filament near AR 3664.</span>
              </button>
            </li>
            <li>
              <button type="button" class="btn btn--ghost" data-activity-id="2021-11-01T02:00:00-CME-001">
                <span class="title">2021 Nov 1 · AR 2887 M1.5 eruption</span>
                <span class="description">Earth-facing eruption with dimming, EUV wave, and post-eruptive loops.</span>
              </button>
            </li>
            <li>
              <button type="button" class="btn btn--ghost" data-activity-id="2017-09-10T16:09:00-CME-001">
                <span class="title">2017 Sep 10 · X-class flare storm</span>
                <span class="description">Fast halo launched with the renowned September 2017 solar storm.</span>
              </button>
            </li>
            <li>
              <button type="button" class="btn btn--ghost" data-activity-id="2012-07-23T02:48:00-CME-001">
                <span class="title">2012 Jul 23 · Carrington-class near miss</span>
                <span class="description">Legendary farside blast often compared to the 1859 Carrington Event.</span>
              </button>
            </li>
          </ul>
        </section>

        <details class="finder">
          <summary>Find CMEs by date</summary>
          <form id="findForm" class="row">
            <label for="start">Start</label>
            <input id="start" name="start" type="date" required />
            <label for="end">End</label>
            <input id="end" name="end" type="date" required />
            <button type="submit" class="btn btn--primary">Search</button>
          </form>
          <ul id="results" class="list"></ul>
        </details>
      </section>

      <article id="md" class="markdown card"></article>
      </div>
    </main>

    <script type="module" src="/src/pages/storm/main.ts"></script>
  </body>
</html>
