<!doctype html>
<html lang="en">
  <head>
    <!-- @include site-head -->
    <title>Solar storms — NASA Open APIs Visualization Hub</title>
    <link rel="stylesheet" href="/src/styles/storm.css" />
  </head>
  <body class="page--explorer theme-cme">
    <!-- @include site-header current="storm" -->

    <main>
    <section class="page-banner">
      <div class="page-banner__text">
        <h1>Solar storms</h1>
        <p>Coronal mass ejections from NASA’s DONKI catalogue: how fast each one left the Sun, when it arrives, and how far from the poles the aurora could reach.</p>
      </div>
      <img src="/art/storm.webp" alt="" width="1536" height="1024" decoding="async" />
    </section>

      <div class="page-shell storm">
      <article id="md" class="storm-report" aria-live="polite"></article>

      <aside class="storm-index" aria-label="Choose an eruption">
        <section class="storm-index__group">
          <h2>This week</h2>
          <ul id="recent" class="storm-list">
            <li class="storm-list__note">Asking DONKI for the past seven days.</li>
          </ul>
        </section>

        <section class="storm-index__group">
          <h2>Storms to remember</h2>
          <ul class="storm-list">
            <li>
              <button type="button" data-activity-id="2024-05-10T07:12:00-CME-001">
                <span class="storm-list__when">10 May 2024</span>
                <span class="storm-list__what">An X3.9 flare from the active region whose storms took aurora to Mexico and Florida that week.</span>
              </button>
            </li>
            <li>
              <button type="button" data-activity-id="2024-05-10T21:28:00-CME-001">
                <span class="storm-list__when">10 May 2024, later</span>
                <span class="storm-list__what">A long filament in the Sun’s south lets go: narrow, faint and slow.</span>
              </button>
            </li>
            <li>
              <button type="button" data-activity-id="2021-11-01T02:00:00-CME-001">
                <span class="storm-list__when">1 November 2021</span>
                <span class="storm-list__what">An Earth-facing eruption with coronal dimming and a wave across the disc.</span>
              </button>
            </li>
            <li>
              <button type="button" data-activity-id="2017-09-10T16:09:00-CME-001">
                <span class="storm-list__when">10 September 2017</span>
                <span class="storm-list__what">One of the fastest of its solar cycle, thrown off by an X8.2 flare.</span>
              </button>
            </li>
            <li>
              <button type="button" data-activity-id="2012-07-23T02:48:00-CME-001">
                <span class="storm-list__when">23 July 2012</span>
                <span class="storm-list__what">The Carrington-class blast that crossed Earth’s orbit about a week after we had passed.</span>
              </button>
            </li>
          </ul>
        </section>

        <section class="storm-index__group">
          <h2>Any other dates</h2>
          <form id="findForm" class="storm-form">
            <label class="field">From <input id="start" name="start" type="date" required /></label>
            <label class="field">To <input id="end" name="end" type="date" required /></label>
            <button type="submit" class="btn">Search</button>
          </form>
          <ul id="results" class="storm-list"></ul>
          <form id="idForm" class="storm-form storm-form--id">
            <label class="field">DONKI activity ID
              <input id="id" name="id" placeholder="2024-05-10T07:12:00-CME-001" autocomplete="off" spellcheck="false" />
            </label>
            <button id="loadBtn" type="submit" class="btn">Open</button>
          </form>
        </section>
      </aside>
      </div>
    </main>

    <!-- @include site-footer -->
    <script type="module" src="/src/pages/storm/main.ts"></script>
  </body>
</html>
