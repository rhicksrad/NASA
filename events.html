<!doctype html>
<html lang="en">
  <head>
    <!-- @include site-head -->
    <title>Earth events — NASA Open APIs Visualization Hub</title>
    <link rel="stylesheet" href="/src/styles/page-shell.css" />
  </head>
  <body class="page--explorer theme-events">
    <!-- @include site-header current="events" -->

    <section class="page-banner">
      <div class="page-banner__text">
        <h1>Earth events</h1>
        <p>Wildfires, severe storms, volcanoes and sea ice as NASA’s EONET catalogue records them, on a map you can filter by kind and date.</p>
      </div>
      <img src="/art/events.webp" alt="" width="1536" height="1024" decoding="async" />
    </section>

    <main class="page-shell events">
      <form id="filters" class="events-filters">
        <label class="field">Status
          <select id="status" name="status">
            <option value="open" selected>Under way</option>
            <option value="closed">Ended</option>
          </select>
        </label>
        <label class="field">Kind
          <select id="category" name="category">
            <option value="">Everything</option>
          </select>
        </label>
        <label class="field">From <input id="start" name="start" type="date" required /></label>
        <label class="field">To <input id="end" name="end" type="date" required /></label>
        <button type="submit" class="btn btn--primary">Show</button>
        <p id="count" class="events-count" aria-live="polite"></p>
      </form>

      <div class="events-grid">
        <div class="events-main">
          <figure class="events-map">
            <div id="map" class="map" aria-label="Map of EONET events"></div>
            <figcaption id="legend" class="legend"></figcaption>
          </figure>

          <section class="events-detail" aria-live="polite">
            <h2 id="detailTitle">Pick an event</h2>
            <div id="detail" class="events-detail__body">
              <p>Choose a marker on the map or a line in the list to see where it is, how big it has grown and who reported it.</p>
            </div>
          </section>
        </div>

        <section class="events-list" aria-label="Events, newest first">
          <ul id="list" class="list"></ul>
        </section>
      </div>
    </main>

    <script type="module" src="/src/pages/events/main.ts"></script>
  </body>
</html>
