<!doctype html>
<html lang="en">
  <head>
    <!-- @include site-head -->
    <title>EONET Explorer — NASA Open APIs Visualization Hub</title>
  </head>
  <body>
    <!-- @include site-header current="events" -->

    <main class="page-shell">
      <div class="main-wrap">
        <section class="controls card">
          <div>
            <h1>EONET Explorer</h1>
            <p class="meta">Discover active and historical natural events sourced from NASA's EONET catalog.</p>
          </div>
          <form id="filters" class="row">
            <label>
              Status
              <select id="status" name="status">
                <option value="open" selected>Open</option>
                <option value="closed">Closed</option>
              </select>
            </label>
            <label>
              Category
              <select id="category" name="category">
                <option value="">All</option>
              </select>
            </label>
            <label>
              Start
              <input id="start" name="start" type="date" required />
            </label>
            <label>
              End
              <input id="end" name="end" type="date" required />
            </label>
            <button type="submit" class="btn btn--primary">Load</button>
          </form>
        </section>

        <section class="map-panel card">
          <h2>Live Event Map</h2>
          <p class="meta">Pins appear as events are loaded. Select one to highlight the location.</p>
          <div id="map" class="map" aria-label="Map of EONET events"></div>
          <div id="legend" class="legend"></div>
        </section>

        <section class="results-grid">
          <div class="panel card events">
            <h2>Events</h2>
            <p class="meta">Results adapt based on the filters above.</p>
            <ul id="list" class="list"></ul>
          </div>

          <div class="panel card detail">
            <h2 id="detailTitle">Event Detail</h2>
            <article id="detail" class="markdown">Pick an event.</article>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="/src/pages/events/main.ts"></script>
  </body>
</html>
