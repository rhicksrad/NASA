name: Deploy Cloudflare

# Publishes the site and the API Worker together. Off until the repo variable
# CF_DEPLOY is `on` and the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# exist. Always on GitHub's runners, so the Cloudflare token never reaches the PCs,
# and never for fork pull requests, which cannot read secrets anyway.

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: deploy
    if: vars.CF_DEPLOY == 'on' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9
          run_install: false
          # A fresh folder per job: the default (~/setup-pnpm) persists on a self-hosted
          # runner and its half-written state has failed an install.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cf
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # A preview address for each pull request from this repository.
  preview:
    name: preview
    if: vars.CF_DEPLOY == 'on' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9
          run_install: false
          # A fresh folder per job: the default (~/setup-pnpm) persists on a self-hosted
          # runner and its half-written state has failed an install.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cf
      - name: Upload a preview version
        run: pnpm exec wrangler versions upload --preview-alias "pr-${PR_NUMBER}" --message "PR ${PR_NUMBER}" | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
