name: Deploy Pages

# Builds on Ryan's PCs when the repo variable CI_RUNNER is `local` (pushes to
# main are trusted), and always deploys from a GitHub runner so the deploy
# token never reaches the PCs.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# A deployment that is halfway through is finished, not cancelled, by the next push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER == 'local' && fromJSON('["self-hosted","web-trusted"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Clean the workspace
        if: always() && runner.environment == 'self-hosted'
        run: git clean -ffdx

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
