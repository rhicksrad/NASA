name: Deploy Pages

# The site is served by Cloudflare (cloudflare.yml). GitHub Pages only keeps old
# links alive: it publishes pages-redirect/, whose index.html and 404.html send
# every /NASA/... address to the same page on the Cloudflare address.

on:
  push:
    branches: [ "main" ]
    paths:
      - pages-redirect/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# A deployment that is halfway through is finished, not cancelled, by the next push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: The two redirect pages must match
        run: cmp pages-redirect/index.html pages-redirect/404.html
      # Old page addresses answer 200 rather than falling through to 404.html.
      - name: Copy the redirect to every old page name
        run: |
          for page in *.html; do
            [ "$page" = index.html ] || cp pages-redirect/index.html "pages-redirect/$page"
          done
          ls pages-redirect
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v5
