name: Rebuild SBDB index

# Manual only. Rebuilds public/sbdb-index.json from the dumps in data/sbdb-source
# and offers it as a download; it commits nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER == 'local' && fromJSON('["self-hosted","web-trusted","python"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/build_sbdb_index.py
      - uses: actions/upload-artifact@v4
        with:
          name: sbdb-index
          path: public/sbdb-index.json
          retention-days: 7
      - name: Clean the workspace
        if: always() && runner.environment == 'self-hosted'
        run: git clean -ffdx && git checkout -- .
